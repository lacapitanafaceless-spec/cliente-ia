<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cliente IA</title>

<style>
body {
  background:#0B0B0F;
  color:white;
  font-family:sans-serif;
  text-align:center;
  padding:20px;
}

.container {
  max-width:500px;
  margin:auto;
}

h1 {
  font-size:24px;
}

.sub {
  color:#a78bfa;
  font-size:14px;
}

input, select {
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#111116;
  border:1px solid #2a2a3e;
  color:white;
  border-radius:8px;
}

button {
  width:100%;
  padding:14px;
  margin-top:15px;
  background:#FACC15;
  border:none;
  font-weight:bold;
  cursor:pointer;
  border-radius:8px;
}

.result {
  margin-top:20px;
  background:#111116;
  padding:20px;
  border-radius:10px;
  border:1px solid #2a2a3e;
}

.paywall {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.paywall-box {
  background:#111116;
  padding:30px;
  border-radius:10px;
  text-align:center;
  max-width:350px;
}

.lock {
  color:#FACC15;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Consigue clientes con IA</h1>
<p class="sub">Sin anuncios. Sin experiencia.</p>

<select id="nicho">
<option>Fitness</option>
<option>Marketing</option>
<option>Coaching</option>
<option>Ecommerce</option>
</select>

<input id="producto" placeholder="Tu producto">
<input id="precio" placeholder="Precio ($)">

<button onclick="generar()">⚡ Generar cliente</button>

<div id="resultado" class="result" style="display:none;"></div>

<button onclick="irPago()">🔥 Unlock full system — $19</button>

<p class="sub">+127 personas ya generaron clientes hoy</p>

</div>

<!-- PAYWALL -->
<div class="paywall" id="paywall">
  <div class="paywall-box">
    <h2>🔒 Acceso limitado</h2>
    <p>Ya has probado el sistema.<br>Desbloquea acceso completo.</p>

    <button onclick="irPago()">🔥 Desbloquear ahora — $19</button>
    <button onclick="cerrarPaywall()">Seguir gratis</button>
  </div>
</div>

<script>
let usos = 1;
let pro = false;

// CHECK PRO DESDE URL
function checkPro(){
  const url = new URLSearchParams(window.location.search);

  if(url.get("success") === "true"){
    localStorage.setItem("proUser","true");
    window.history.replaceState({}, document.title, window.location.pathname);
  }

  if(localStorage.getItem("proUser")==="true"){
    activarPro();
  }
}

// ACTIVAR PRO
function activarPro(){
  pro = true;
  usos = 999;
}

// GENERAR
function generar(){

  if(!pro){
    usos--;
    if(usos < 0){
      document.getElementById("paywall").style.display="flex";
      return;
    }
  }

  document.getElementById("resultado").style.display="block";

  document.getElementById("resultado").innerHTML = `
  <p><strong>🎯 Contenido:</strong> "Este error está frenando tus resultados"</p>
  <p><strong>💬 DM:</strong> "Hey, vi que quieres mejorar tus resultados..."</p>
  <p><strong>💰 Resultado:</strong> 1-3 clientes potenciales en 24h</p>

  <hr>

  <p class="lock">🔒 Desbloquea el sistema completo para generar clientes cada día</p>
  `;
}

// PAGO → SYSTEME
function irPago(){
  window.location.href="https://www.lacapitanafaceless.com/cf82f970";
}

// CERRAR PAYWALL
function cerrarPaywall(){
  document.getElementById("paywall").style.display="none";
}

// INIT
checkPro();
</script>

</body>
</html>
