<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cliente IA Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-6">

<h1 class="text-2xl text-purple-500 mb-4">Cliente IA Generator</h1>

<button onclick="generar()" class="bg-yellow-400 text-black px-4 py-2 mb-4">
Generar hooks
</button>

<div id="resultado"></div>

<script>
let usado = false;

function generar() {
  if (usado) {
    document.getElementById(\"resultado\").innerHTML = `
      <p>🚫 Has alcanzado el límite</p>
      <button>Desbloquear por 9€</button>
    `;
    return;
  }

  usado = true;

  document.getElementById(\"resultado\").innerHTML = `
    <p>🔥 Cómo conseguir clientes en 7 días</p>
    <p>💰 El mensaje que convierte</p>
    <p>🚀 Sistema oculto</p>
    <p style=\"filter: blur(4px)\">⚡ Hook secreto 1</p>
    <p style=\"filter: blur(4px)\">⚡ Hook secreto 2</p>
  `;
}
</script>

</body>
</html>
